<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situação do aluno</title>
    <link rel="stylesheet" href="../modelo/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Programa situação do aluno
                    <form action="">
                        <p>Nome do aluno:
                            <input type="text" id="inNome" required>
                        </p>
                        <p>1° Nota
                            <input type="number" id="inNota1" min="0" max="10"
                            step="0.1" required>
                        </p>
                        <p>2° Nota
                            <input type="number" id="inNota2" min="0" max="10"
                            step="0.1" required>
                        </p>
                        <input type="submit" class="btn btn-warning" value="Exibir média e situação">
                    </form>
                    <h3 id="inResp1"></h3>
                    <h4 id="inResp2"></h4>
                </h1>
            </div>
        </div>
    </div>
    <script src="../modelo/js/exemplo01.js"></script>
</body>
</html>
