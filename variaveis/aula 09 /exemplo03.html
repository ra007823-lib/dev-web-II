<script>
    const bairro = prompt("Bairro de entrega: ");
    let taxaEntrega;
    switch(bairro){
        case "Centro":
            taxaEntrega = 5
            break
        case "Fragata":
        case "Três vendas":
            taxaEntrega = 7 
            break
        case "Laranjal":
            taxaEntrega = 10
            break
        default:
            taxaEntrega = 8
    }
    alert(`taxa R$${taxaEntrega.toFixed(2)}`)
</script>
