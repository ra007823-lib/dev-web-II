<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenda Herbie</title>
    <link rel="stylesheet" href="../modelo/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row pt-4">
            <div class="col-4">
                <img src="../modelo/img/03Revenda.jpg" alt="Revenda Herbie" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Revenda Herbie</h1>
                <hr>
                <form action="">
                    <p>Modelo:
                        <input type="text" id="inModelo" required autofocus>
                    </p>
                    <p>Preço:
                        <input type="number" id="inPreco" required>
                        <input type="submit" value="Adicionar" class="btn btn-success">
                    </p>
                    <p>
                        <input type="button" value="Listar Todos" id="btListar" class="btn btn-info">
                        <input type="button" value="Filtrar por Preço" id="btFiltar" class="btn btn-primary">
                        <input type="button" value="Simular Promoção" id="btSimular" class="btn btn-warning">
                    </p>
                    <pre></pre>
                </form>

            </div>
        </div>
    </div>
    <script src="js/ex004.js"></script>
</body>
</html>
