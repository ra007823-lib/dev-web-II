<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra o número</title>
    <link rel="stylesheet" href="../modelo/css/bootstrap.min.css">
    <style>
        .oculta{
            display: none;
        }
        .exibe{
            display: inline;
        }
        .italico{
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row pt-4">
            <div class="col-4">
                <img src="../modelo/img/02jogoDescubra.jpg" alt="Descubra o número" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Discubra um número</h1>
                <hr>
                <form action="">
                    <p>
                        <input type="number" id="inNumero" min = "1" max = "100" required autofocus>
                        <input type="submit" value="Apostar" class="btn btn-success">
                        <input type="button" value="Jogar Novamente" id="btNovo" class="oculta">
                    </p>
                    
                </form>
                <h3>Erros: <span id="outErros">0</span></h3>
                <h3>Chances: <span id="outChances">6</span></h3>
                <h3 id="outDica" class="italico">Dica: é um número de 1 a 100</h3>
            </div>
        </div>
    </div>
    <script src="js/ex002.js"></script>
</body>
</html>
