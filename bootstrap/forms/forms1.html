<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../modelo/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="mb-4">Laboratório de Formulários</h2> 
        <!-- OS MODELOS DA AULA SERÃO INSERIDOS AQUI -->
        <form action="">
          <form class="mb-5 border-bottom pb-4">
<h5>3. Input Groups e Floating Labels</h5>
<!-- Prefixo e Sufixo -->
<div class="input-group mb-3">
<span class="input-group-text">R$</span>
<input type="number" class="form-control" placeholder="Valor da mensalidade">
<span class="input-group-text">,00</span>
</div>
<!-- Input com Botão acoplado -->
<div class="input-group mb-4">
<input type="text" class="form-control" placeholder="Buscar por CPF ou
Matrícula...">
<button class="btn btn-primary" type="button">Pesquisar</button>
</div>
<!-- Floating Labels -->
<div class="row g-3">
<div class="col-md-6">
<div class="form-floating">
<input type="email" class="form-control" id="floatEmail"
placeholder="nome@exemplo.com">
<label for="floatEmail">E-mail (Floating Label)</label>
</div>
</div>
<div class="col-md-6">
<div class="form-floating">
<input type="password" class="form-control" id="floatSenha"
placeholder="Senha">
<label for="floatSenha">Senha</label>
</div>
</div>
</div>
</form>
        </form>
      </div>
    </div>
  </div>
